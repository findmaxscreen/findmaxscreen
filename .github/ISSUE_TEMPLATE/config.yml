# Blank issues are disabled. They used to be on, so that the site's prefilled
# "Report" link would not be thrown away by the template chooser - but the link
# now names its template directly (issues/new?template=site.yml), which keeps
# the prefill *and* the required fields. The reason to leave the back door open
# went with it.
#
# What that buys: every issue arrives having answered the questions that make
# one actionable, and a drive-by "doesnt work" has nowhere to land.
blank_issues_enabled: false
contact_links:
  - name: Correct the venue data at source
    url: https://imax.fandom.com/wiki/List_of_IMAX_venues
    about: >-
      Projectors, screen sizes and locations come from the IMAX Wiki. Fixing it
      there reaches everyone and flows back here on the next daily sync. No
      account needed, and it is the right place for almost every data fix.
