# An issue *form*, not a markdown template. The markdown version asked all of
# this too, in bold labels and HTML comments - and got reports that had deleted
# every one of them. Here `required: true` means GitHub will not accept the
# submission at all, so the fields arrive filled in or not at all.
#
# The known-issues list used to sit in a comment at the bottom, where it was
# read after the report was already written, if ever. As a required checkbox it
# is read first, which is the only position from which it can prevent anything.
name: Broken link or site bug
description: Something on the page is broken, wrong or unusable
title: "Site: "
labels: ["site"]
body:
  - type: markdown
    attributes:
      value: |
        For wrong venue **data** — a projector, screen size or location — use
        the other template. The wiki is usually the right place to fix that,
        and it needs no account.

  - type: checkboxes
    id: known
    attributes:
      label: Please check these first
      description: >-
        All three are deliberate and already understood. Ticking the box just
        means you have read them, so we do not both spend time on a
        non-problem.
      options:
        - label: >-
            I know "Maps" for some venues opens the town rather than the door.
            About half the venues could not be matched to an exact building in
            OpenStreetMap; those hand the venue's name to Google instead.
          required: true
        - label: >-
            I know "Showtimes" is a search rather than a direct link. Showtimes
            are licensed data that changes daily, and a static site cannot hold
            them honestly.
          required: true
        - label: >-
            I know some "Cinema site" links refuse to load. Several chains
            block traffic by region or by automation; the link is usually fine
            from the country the theatre is in.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: The pager vanished after I searched for Dune.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: The URL you were on
      description: >-
        Please paste the whole thing. Every filter, the section and the page
        number live in the query string, so the URL alone reproduces what you
        were looking at — and without it most page bugs cannot be chased.
      placeholder: https://findmaxscreen.com/?q=london&film70=1
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone / Firefox 130 on Windows
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors, if you know how to look
      description: >-
        Optional, and skip it without worrying if you are not sure. When a page
        breaks after it has rendered this is usually the only evidence there is.
      render: text
    validations:
      required: false
