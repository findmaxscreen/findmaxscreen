<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 690" width="1480" height="690" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect width="1480" height="690" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1e1e1e">FindMaxScreen — data flow</text>
  <text x="40" y="72" font-size="15" fill="#6b7280">One wiki page in, a static site out. Nothing runs in production.</text>

  <!-- zones -->
  <rect x="20" y="100" width="820" height="560" rx="10" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-width="1"/>
  <text x="38" y="124" font-size="14" font-weight="600" fill="#2563eb" letter-spacing="1">LOCAL — YOUR MACHINE</text>

  <rect x="870" y="490" width="590" height="170" rx="10" fill="#d3f9d8" fill-opacity="0.45" stroke="#22c55e" stroke-width="1"/>
  <text x="888" y="514" font-size="14" font-weight="600" fill="#15803d" letter-spacing="1">PUBLIC</text>

  <!-- sources -->
  <rect x="50" y="170" width="200" height="70" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="200" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">imax.fandom.com</text>
  <text x="150" y="221" font-size="13" text-anchor="middle" fill="#92400e">CC BY-SA · venue facts</text>

  <rect x="50" y="320" width="200" height="70" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="350" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">OpenStreetMap</text>
  <text x="150" y="371" font-size="13" text-anchor="middle" fill="#92400e">ODbL · coords, websites</text>

  <!-- scripts -->
  <rect x="330" y="170" width="170" height="70" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="415" y="200" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">sync.py</text>
  <text x="415" y="221" font-size="13" text-anchor="middle" fill="#5b21b6">keyed on revid</text>

  <rect x="330" y="320" width="170" height="70" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="415" y="350" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">geocode.py</text>
  <text x="415" y="371" font-size="13" text-anchor="middle" fill="#5b21b6">1 req/sec, new only</text>

  <path d="M252 205 H322" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M252 355 H322" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- database -->
  <rect x="590" y="235" width="200" height="92" rx="8" fill="#c3fae8" stroke="#0e7490" stroke-width="2"/>
  <text x="690" y="268" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">theatres.sqlite3</text>
  <text x="690" y="290" font-size="13" text-anchor="middle" fill="#0e7490">476 venues</text>
  <text x="690" y="309" font-size="13" text-anchor="middle" fill="#0e7490">+ every change ever made</text>
  <text x="690" y="348" font-size="13" text-anchor="middle" fill="#6b7280">committed to git — it is the history</text>

  <path d="M502 205 L583 262" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M502 355 L583 305" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- admin, local only -->
  <rect x="50" y="470" width="280" height="100" rx="8" fill="#ffc9c9" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="190" y="505" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">serve.py + admin.html</text>
  <text x="190" y="527" font-size="13" text-anchor="middle" fill="#b91c1c">manual refresh, change log</text>
  <text x="190" y="547" font-size="13" text-anchor="middle" fill="#b91c1c">127.0.0.1 only</text>
  <text x="190" y="592" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="600">never copied into dist/</text>
  <path d="M588 315 L338 478" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ah)"/>

  <!-- build -->
  <rect x="590" y="400" width="200" height="70" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="690" y="430" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">export.py</text>
  <text x="690" y="451" font-size="13" text-anchor="middle" fill="#5b21b6">validate, then allow-list</text>
  <path d="M690 330 V393" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="590" y="540" width="200" height="70" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="690" y="570" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">dist/</text>
  <text x="690" y="591" font-size="13" text-anchor="middle" fill="#15803d">7 files · 49 KB gzipped</text>
  <path d="M690 473 V533" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- publish -->
  <rect x="900" y="540" width="230" height="70" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="1015" y="570" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">GitHub Pages</text>
  <text x="1015" y="591" font-size="13" text-anchor="middle" fill="#1d4ed8">daily, via Actions</text>
  <path d="M793 575 H893" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="1190" y="540" width="250" height="70" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="1315" y="570" font-size="16" font-weight="600" text-anchor="middle" fill="#1e1e1e">findmaxscreen.com</text>
  <text x="1315" y="591" font-size="13" text-anchor="middle" fill="#1d4ed8">no server, no database</text>
  <path d="M1133 575 H1183" stroke="#4a9eed" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- what the browser does -->
  <rect x="900" y="180" width="540" height="240" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
  <text x="920" y="208" font-size="15" font-weight="700" fill="#1e1e1e">In the visitor's browser</text>
  <text x="920" y="238" font-size="14" fill="#374151">One fetch of venues.json, then everything is local:</text>
  <text x="920" y="266" font-size="14" fill="#374151">• search, filters, sorting and paging — query.js</text>
  <text x="920" y="292" font-size="14" fill="#374151">• country guessed from the browser's timezone — geo.js</text>
  <text x="920" y="318" font-size="14" fill="#374151">• no API call, no cookie, no IP sent anywhere</text>
  <text x="920" y="356" font-size="14" font-style="italic" fill="#6b7280">Outbound links only when a visitor clicks one:</text>
  <text x="920" y="380" font-size="14" font-style="italic" fill="#6b7280">Google Maps, the cinema's own site, a showtimes search.</text>
</svg>
