<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 640" width="1480" height="640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <text x="40" y="42" font-size="24" font-weight="700" fill="#1a1a18">Near me — location states</text>
  <text x="40" y="66" font-size="14" fill="#6d6a63">state.geoStatus in web/app.js, driven by locate() in web/geo.js. Every ask settles: the whole attempt races a hard deadline.</text>

  <!-- idle -->
  <rect x="40" y="120" width="170" height="56" rx="8" fill="#eef4fb" stroke="#5b8db8" stroke-width="1.5"/>
  <text x="125" y="153" font-size="17" text-anchor="middle" fill="#1a1a18">idle</text>

  <!-- gesture arrow -->
  <line x1="210" y1="148" x2="330" y2="148" stroke="#5b8db8" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="138" font-size="12" text-anchor="middle" fill="#6d6a63">gesture only</text>

  <!-- locating -->
  <rect x="332" y="120" width="200" height="56" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/>
  <text x="432" y="146" font-size="17" text-anchor="middle" fill="#1a1a18">locating</text>
  <text x="432" y="164" font-size="11" text-anchor="middle" fill="#6d6a63">one-shot 8 s → watch warm-up 10 s</text>

  <!-- located -->
  <line x1="532" y1="136" x2="680" y2="136" stroke="#3d7a4f" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="606" y="126" font-size="12" text-anchor="middle" fill="#3d7a4f">fix (either path)</text>
  <rect x="682" y="108" width="210" height="56" rx="8" fill="#eef7ef" stroke="#3d7a4f" stroke-width="1.5"/>
  <text x="787" y="134" font-size="17" text-anchor="middle" fill="#1a1a18">located</text>
  <text x="787" y="152" font-size="11" text-anchor="middle" fill="#6d6a63">memory only — never stored</text>

  <!-- manual -->
  <rect x="682" y="260" width="210" height="56" rx="8" fill="#e8f6f4" stroke="#2a7f78" stroke-width="1.5"/>
  <text x="787" y="286" font-size="17" text-anchor="middle" fill="#1a1a18">manual</text>
  <text x="787" y="304" font-size="11" text-anchor="middle" fill="#6d6a63">a city the visitor named — stored</text>

  <line x1="787" y1="164" x2="787" y2="258" stroke="#2a7f78" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="800" y="215" font-size="12" fill="#2a7f78">“Remember I'm near …” — detection becomes declaration</text>

  <path d="M 894 288 C 990 288 990 122 894 122" fill="none" stroke="#3d7a4f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="985" y="205" font-size="12" fill="#3d7a4f">silent upgrade on load (5 s patience, no banner flicker)</text>

  <path d="M 440 180 C 470 230 560 288 680 288" fill="none" stroke="#2a7f78" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="430" y="270" font-size="12" fill="#2a7f78">typed a city (any state, even mid-ask)</text>

  <!-- failure row -->
  <rect x="40" y="420" width="180" height="52" rx="8" fill="#fbeeee" stroke="#a03b3b" stroke-width="1.5"/>
  <text x="130" y="451" font-size="16" text-anchor="middle" fill="#1a1a18">denied</text>
  <rect x="250" y="420" width="190" height="52" rx="8" fill="#f2f1ee" stroke="#6d6a63" stroke-width="1.5"/>
  <text x="345" y="451" font-size="16" text-anchor="middle" fill="#1a1a18">unsupported</text>
  <rect x="470" y="420" width="190" height="52" rx="8" fill="#fdf1e3" stroke="#b26a00" stroke-width="1.5"/>
  <text x="565" y="451" font-size="16" text-anchor="middle" fill="#1a1a18">unavailable</text>
  <rect x="690" y="420" width="170" height="52" rx="8" fill="#fdf1e3" stroke="#b26a00" stroke-width="1.5"/>
  <text x="775" y="451" font-size="16" text-anchor="middle" fill="#1a1a18">timeout</text>

  <line x1="380" y1="176" x2="150" y2="418" stroke="#a03b3b" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="230" y="300" font-size="12" fill="#a03b3b">code 1</text>
  <line x1="440" y1="176" x2="545" y2="418" stroke="#b26a00" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="470" y="310" font-size="12" fill="#b26a00">code 2, both paths</text>
  <line x1="490" y1="176" x2="750" y2="418" stroke="#b26a00" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="650" y="345" font-size="12" fill="#b26a00">code 3 / deadline</text>

  <text x="40" y="505" font-size="13" fill="#a03b3b">FINAL — the browser remembers a refusal, and a missing API will not appear. Re-asking shows nothing. The city picker is the only way on.</text>
  <text x="470" y="527" font-size="13" fill="#b26a00">WEATHER — the next tab tap retries (no prompt; permission is already granted). A named city stands in, in the meantime.</text>

  <text x="40" y="575" font-size="13" fill="#6d6a63">The line the states keep: what the device measured stays in memory; what the visitor declared (a country, a city name) may be stored.</text>
  <text x="40" y="597" font-size="13" fill="#6d6a63">On some machines a fix never comes — access points unknown to Apple's database fail with code 2 forever, in every browser. That is what “manual” is for.</text>
</svg>
